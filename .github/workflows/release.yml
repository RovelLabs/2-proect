name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Skladno-v0.1.0-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-artifacts/Skladno-v0.1.0-android.apk

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-darwin-arm64

      - name: Build Web App
        run: npm run build

      - name: Build macOS App Bundle & DMG
        run: |
          chmod +x scripts/build-macos-dmg.sh
          ./scripts/build-macos-dmg.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            releases/Skladno-*-macos.dmg
            releases/Skladno-*-macos-universal.zip

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Package Desktop Releases
        run: |
          node scripts/build-macos-app.cjs
          node scripts/package-all-releases.cjs

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: |
            releases/Skladno-*-windows-x64.zip
            releases/Skladno-*-android-project.zip

  publish-release:
    needs: [build-android, build-macos, build-desktop]
    if: always() && (needs.build-desktop.result == 'success' || needs.build-android.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: release-assets/

      - name: Download macOS Packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-packages
          path: release-assets/

      - name: Download Desktop Packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-packages
          path: release-assets/

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Skladno ${{ github.ref_name }}
          body: |
            ## 🎉 Складно (Skladno) ${{ github.ref_name }} — Официальный мультиплатформенный релиз

            Полноценный кроссплатформенный сплиттер групповых расходов с алгоритмической минимизацией транзакций и моментальной оплатой по СБП!

            ---

            ### 📱 Android
            - **Файл:** `Skladno-v0.1.0-android.apk` (нативный APK, 3.8 МБ)
            - **Установка:** Скачайте файл на смартфон и нажмите установить. Работает автономно и офлайн.

            ### 🍎 macOS (Apple Silicon & Intel)
            - **Файлы:**
              - `Skladno-v0.1.0-macos.dmg` — образ диска с автоматической установкой в «Программы».
              - `Skladno-v0.1.0-macos-universal.zip` — портативный бандл `Skladno.app`.
            - **Установка:** Откройте `.dmg` и перетащите иконку «Складно» в папку «Программы» (Applications).

            ### 💻 Windows (x64)
            - **Файл:** `Skladno-v0.1.0-windows-x64.zip`
            - **Установка:** Распакуйте архив и запустите `Skladno.vbs` (или `Skladno.cmd`). Для создания ярлыка на Рабочем столе запустите `Создать_ярлык.cmd`.

            ### 🤖 Для Android-разработчиков
            - **Файл:** `Skladno-v0.1.0-android-project.zip` — исходный проект для Android Studio.

            ---
            *Все сборки проверены и включают полную криптографическую верификацию в `SHA256SUMS.txt`.*
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
