name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/Skladno-v0.1.0-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build-artifacts/Skladno-v0.1.0-android.apk

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Package Desktop Releases
        run: |
          node scripts/build-macos-app.cjs
          node scripts/package-all-releases.cjs

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: releases/*

  publish-release:
    needs: [build-android, build-desktop]
    if: always() && (needs.build-desktop.result == 'success' || needs.build-android.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: release-assets/

      - name: Download Desktop Packages
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-packages
          path: release-assets/

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || true
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Skladno ${{ github.ref_name }}
          body: |
            ## 🎉 Складно (Skladno) ${{ github.ref_name }} — Релиз для всех платформ!
            
            ### 📱 Android
            - Скачайте `Skladno-v0.1.0-android.apk` и установите на смартфон или планшет.
            
            ### 💻 Windows
            - Скачайте `Skladno-v0.1.0-windows-x64.zip`, распакуйте и запустите `Skladno.vbs` или `Skladno.cmd`.
            
            ### 🍎 macOS
            - Скачайте `Skladno-v0.1.0-macos-universal.zip`, распакуйте и перетащите `Skladno.app` в папку «Программы».
            
            ---
            *Все релизы содержат актуальную математику сплита долгов и СБП-интеграцию.*
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
